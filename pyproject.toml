[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-options-platform"
version = "0.1.0"
description = "Paper-first BTC credit spreads with Greeks, risk controls and Jev-gated execution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "pydantic>=2.10", "httpx>=0.28", "websockets>=14",
  "pyarrow>=18", "duckdb>=1.2", "arch>=7.2", "fastapi>=0.115", "uvicorn>=0.34",
  "typer>=0.15", "rich>=13.9",
]

[project.scripts]
btc-options = "btc_options.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "QuantLib>=1.37"]

[tool.hatch.build.targets.wheel]
packages = ["src/btc_options"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "btc_options/frontend_dist"

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
